<svg xmlns="http://www.w3.org/2000/svg" width="600" height="382" viewBox="0 0 600 382">
  <title>Execution Time Comparison: HEX vs Legacy Engines</title>

  <!-- background -->
  <rect width="600" height="382" fill="#fcfcfb"/>

  <!-- chart title -->
  <text x="324" y="16" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
    font-size="13" font-weight="600" fill="#0b0b0b">Execution Time Comparison</text>
  <text x="324" y="29" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
    font-size="10" fill="#898781">Log scale · milliseconds (ms) · HEX vs Legacy engines</text>

  <!--
    Layout:  W=600  H=382
    ml=68  mr=20  mt=42  mb=104
    innerW=512  innerH=236  base=278
    groupW=170.67  barW=22  gap=2  r=4

    log10 scale: minLog=0  maxLog=4  logRange=4
    yOf(v) = 278 − (log10(v)/4)×236

    Decade y-values:
      1ms  → 278    10ms → 219    100ms → 160
      1k   →  101   10k  →  42

    Group centers (cx):
      cx0=153.33  cx1=324  cx2=494.67

    Bar x-left:
      Legacy  xL = cx − 23    HEX  xH = cx + 1
      G0: L=130.33  H=154.33
      G1: L=301     H=325
      G2: L=471.67  H=495.67

    Data y-tops (bar top = yOf(value)):
      Legacy UNION       (1700ms): 278 − 3.2304×59 = 278 − 190.59 = 87.41
      Legacy NOT NULL    (4900ms): 278 − 3.6902×59 = 278 − 217.72 = 60.28
      Legacy CASE FIXED   (200ms): 278 − 2.3010×59 = 278 − 135.76 = 142.24
      HEX UNION           (8.2ms): 278 − 0.9138×59 = 278 −  53.92 = 224.08
      HEX NOT NULL        (6.6ms): 278 − 0.8195×59 = 278 −  48.35 = 229.65
      HEX CASE FIXED      (3.8ms): 278 − 0.5798×59 = 278 −  34.21 = 243.79
  -->

  <!-- ── minor gridlines (×2 and ×5 per decade) ── -->
  <!-- exp=0: 2ms=259.43, 5ms=234.57 -->
  <line x1="68" y1="259" x2="580" y2="259" stroke="#e1e0d9" stroke-width="0.5" opacity="0.5"/>
  <line x1="68" y1="235" x2="580" y2="235" stroke="#e1e0d9" stroke-width="0.5" opacity="0.5"/>
  <!-- exp=1: 20ms=200.43, 50ms=175.57 -->
  <line x1="68" y1="200" x2="580" y2="200" stroke="#e1e0d9" stroke-width="0.5" opacity="0.5"/>
  <line x1="68" y1="176" x2="580" y2="176" stroke="#e1e0d9" stroke-width="0.5" opacity="0.5"/>
  <!-- exp=2: 200ms=141.43, 500ms=116.57 -->
  <line x1="68" y1="141" x2="580" y2="141" stroke="#e1e0d9" stroke-width="0.5" opacity="0.5"/>
  <line x1="68" y1="117" x2="580" y2="117" stroke="#e1e0d9" stroke-width="0.5" opacity="0.5"/>
  <!-- exp=3: 2000ms=82.43, 5000ms=57.57 -->
  <line x1="68" y1="82"  x2="580" y2="82"  stroke="#e1e0d9" stroke-width="0.5" opacity="0.5"/>
  <line x1="68" y1="58"  x2="580" y2="58"  stroke="#e1e0d9" stroke-width="0.5" opacity="0.5"/>

  <!-- ── major gridlines + y-axis tick labels ── -->
  <line x1="68" y1="278" x2="580" y2="278" stroke="#e1e0d9" stroke-width="1"/>
  <text x="62" y="278" text-anchor="end" dominant-baseline="middle"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11"
    font-variant-numeric="tabular-nums" fill="#898781">1</text>

  <line x1="68" y1="219" x2="580" y2="219" stroke="#e1e0d9" stroke-width="1"/>
  <text x="62" y="219" text-anchor="end" dominant-baseline="middle"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11"
    font-variant-numeric="tabular-nums" fill="#898781">10</text>

  <line x1="68" y1="160" x2="580" y2="160" stroke="#e1e0d9" stroke-width="1"/>
  <text x="62" y="160" text-anchor="end" dominant-baseline="middle"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11"
    font-variant-numeric="tabular-nums" fill="#898781">100</text>

  <line x1="68" y1="101" x2="580" y2="101" stroke="#e1e0d9" stroke-width="1"/>
  <text x="62" y="101" text-anchor="end" dominant-baseline="middle"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11"
    font-variant-numeric="tabular-nums" fill="#898781">1k</text>

  <line x1="68" y1="42" x2="580" y2="42" stroke="#e1e0d9" stroke-width="1"/>
  <text x="62" y="42" text-anchor="end" dominant-baseline="middle"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11"
    font-variant-numeric="tabular-nums" fill="#898781">10k</text>

  <!-- y-axis unit label (rotated) -->
  <text x="22" y="160" text-anchor="middle" dominant-baseline="middle"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" fill="#898781"
    transform="rotate(-90,22,160)">ms</text>

  <!-- baseline (solid, slightly darker) -->
  <line x1="68" y1="278" x2="580" y2="278" stroke="#c3c2b7" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════════════════
       BARS  — rounded top (r=4), square base
       path: M x,278 H x+22 V top+4 Q x+22,top x+18,top H x+4 Q x,top x,top+4 Z
  ════════════════════════════════════════════════════════════════ -->

  <!-- Group 0 — UNION in LEFT OUTER JOIN -->
  <!-- Legacy (orange)  top=87.41  x=130.33 -->
  <path d="M 130.33,278 H 152.33 V 91.41 Q 152.33,87.41 148.33,87.41 H 134.33 Q 130.33,87.41 130.33,91.41 Z"
    fill="#eb6834"/>
  <!-- HEX (blue)  top=224.08  x=154.33 -->
  <path d="M 154.33,278 H 176.33 V 228.08 Q 176.33,224.08 172.33,224.08 H 158.33 Q 154.33,224.08 154.33,228.08 Z"
    fill="#2a78d6"/>

  <!-- Group 1 — NOT NULL PRESERVING CASE -->
  <!-- Legacy (orange)  top=60.28  x=301 -->
  <path d="M 301,278 H 323 V 64.28 Q 323,60.28 319,60.28 H 305 Q 301,60.28 301,64.28 Z"
    fill="#eb6834"/>
  <!-- HEX (blue)  top=229.65  x=325 -->
  <path d="M 325,278 H 347 V 233.65 Q 347,229.65 343,229.65 H 329 Q 325,229.65 325,233.65 Z"
    fill="#2a78d6"/>

  <!-- Group 2 — CASE FIXED -->
  <!-- Legacy (orange)  top=142.24  x=471.67 -->
  <path d="M 471.67,278 H 493.67 V 146.24 Q 493.67,142.24 489.67,142.24 H 475.67 Q 471.67,142.24 471.67,146.24 Z"
    fill="#eb6834"/>
  <!-- HEX (blue)  top=243.79  x=495.67 -->
  <path d="M 495.67,278 H 517.67 V 247.79 Q 517.67,243.79 513.67,243.79 H 499.67 Q 495.67,243.79 495.67,247.79 Z"
    fill="#2a78d6"/>

  <!-- ─── value labels: transparent bg, above each bar, black text ── -->
  <!-- baseline = bar_top − 5  (5px gap between text baseline and bar top)  -->
  <!-- text-anchor="middle" centered on each bar's center-x               -->

  <!-- Legacy UNION  1,700 ms  cx=141  bar-top=87.41 → baseline y=82 -->
  <text x="141" y="82" text-anchor="middle"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9" fill="#0b0b0b">1,700 ms</text>

  <!-- Legacy NOT NULL  4,900 ms  cx=312  bar-top=60.28 → baseline y=55 -->
  <text x="312" y="55" text-anchor="middle"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9" fill="#0b0b0b">4,900 ms</text>

  <!-- Legacy CASE FIXED  200 ms  cx=483  bar-top=142.24 → baseline y=137 -->
  <text x="483" y="137" text-anchor="middle"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9" fill="#0b0b0b">200 ms</text>

  <!-- HEX UNION  8.2 ms  cx=165  bar-top=224.08 → baseline y=219 -->
  <text x="165" y="219" text-anchor="middle"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9" fill="#0b0b0b">8.2 ms</text>

  <!-- HEX NOT NULL  6.6 ms  cx=336  bar-top=229.65 → baseline y=224 -->
  <text x="336" y="224" text-anchor="middle"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9" fill="#0b0b0b">6.6 ms</text>

  <!-- HEX CASE FIXED  3.8 ms  cx=507  bar-top=243.79 → baseline y=238 -->
  <text x="507" y="238" text-anchor="middle"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9" fill="#0b0b0b">3.8 ms</text>

  <!-- ─── x-axis group labels (2 lines, line-height=13) ─────── -->
  <!-- Group 0  cx=153.33  y1=292  y2=305 -->
  <text x="153.33" y="292" text-anchor="middle"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#52514e">UNION in</text>
  <text x="153.33" y="305" text-anchor="middle"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#52514e">LEFT OUTER JOIN</text>

  <!-- Group 1  cx=324  y1=292  y2=305 -->
  <text x="324" y="292" text-anchor="middle"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#52514e">NOT NULL</text>
  <text x="324" y="305" text-anchor="middle"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#52514e">PRESERVING CASE</text>

  <!-- Group 2  cx=494.67  y1=292  y2=305 -->
  <text x="494.67" y="292" text-anchor="middle"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#52514e">CASE</text>
  <text x="494.67" y="305" text-anchor="middle"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#52514e">FIXED</text>

  <!-- ─── legend (centered, y=344/356) ──────────────────────── -->
  <text x="188" y="356" text-anchor="end"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#898781">Engine:</text>
  <!-- Legacy swatch + label -->
  <rect x="194" y="345" width="12" height="12" rx="2" fill="#eb6834"/>
  <text x="210" y="356" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#52514e">Legacy</text>
  <!-- HEX swatch + label -->
  <rect x="262" y="345" width="12" height="12" rx="2" fill="#2a78d6"/>
  <text x="278" y="356" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#52514e">HEX</text>
</svg>
